name: CI

on: 
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set Up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install Dependencies
      working-directory: myExpressApp
      run: npm install

    - name: Run Tests
      working-directory: myExpressApp
      run: npm test

    - name: Build
      working-directory: myExpressApp
      run: npm run build